name: Create Release

on:
    push:
        branches:
            - main
            - deploiement-avance
        tags:
            - 'v*.*.*'

jobs:
    create-release:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        
        steps:
            - name: Check out Git Repo
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
                fetch-tags: true

            - name: Install Node, NPM & Yarn
              uses: actions/setup-node@v4
              with:
                node-version: 20

            - name: Enable Corepack
              run: corepack enable

            - name: Install dependencies
              run: yarn install --immutable --ignore-scripts

            - name: Run Postinstall manully with yarn
              run: yarn electron-builder install-app-deps

            - name: Build
              run: yarn build

            - uses:  simenandre/publish-with-yarn@v1 